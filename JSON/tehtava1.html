    <main>

        <div id="tiedot"></div>

    <script>
        fetch('toteutus.json')
            .then(response => response.json())
            .then(data => naytaToteutus(data))
            .catch(error => {
                document.getElementById("tiedot").innerHTML = "<p>Virhe ladattaessa tietoja.</p>";
            });

        function naytaToteutus(data) {
            let html = `
                <h1>${data.nimi}</h1>
                <p> ${data.osallistujat_lkm} kpl</p>
                <p> ${data.osallistujat.join(" ")}</p>
                <p> ${data.alku} - ${data.loppu}</p>
                <p> ${data.kesto_viikkoina} viikkoa</p>
                <img src="${data.kuva}" alt="Kurssikuva">
            `;
            document.getElementById("tiedot").innerHTML = html;
        }
    </script>
