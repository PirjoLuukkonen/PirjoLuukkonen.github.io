    <main>
        <hr>
        <h1>Helsingin sää</h1>
        <p id="aikaleima"></p>
        <br>
        <p id="vastaus"></p>
        <br>
        <p id="vastaus2"></p>
        <br>
        <p id="vastaus3"></p>
        <br>
        <p id="vastaus4"></p>
        <img id="weather-icon" alt="Sääkuvake">
    </main>
    <script>
            // Säädatan hakufunktio
        function haeSaa() {
            const url = "https://api.openweathermap.org/data/2.5/weather?id=658225&appid=665ecd56dfc08dbb50feb8b8f5034e28&lang=fi&units=metric";

            fetch(url)
                .then(response => response.json())
                .then(data => saa(data))
                .catch(error => {
                    document.getElementById("vastaus").innerHTML = "Säätietojen haku epäonnistui.";
                });
        }

        // Säädatan käsittely
        function saa(data) {
            let teksti = "<h3>Kaupunki:</h3><h4>" + data.name + "</h4>";
            let teksti2 = "<h3>Sää:</h3><h4>" + data.weather[0].description + "</h4>";
            let teksti3 = "<h3>Lämpötila:</h3><h4>" + data.main.temp + "&deg;C</h4>";
            let teksti4 = "<h3>Tuuli:</h3><h4>" + data.wind.speed + " m/s</h4>";

            // Ikoni
            let iconCode = data.weather[0].icon;
            let iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
            document.getElementById("weather-icon").src = iconUrl;

            // Näyttää HTML:llään
            document.getElementById("vastaus").innerHTML = teksti;
            document.getElementById("vastaus2").innerHTML = teksti2;
            document.getElementById("vastaus3").innerHTML = teksti3;
            document.getElementById("vastaus4").innerHTML = teksti4;

            // Aika
            let nyt = new Date();
            let aika = nyt.toLocaleTimeString("fi-FI");
            document.getElementById("aikaleima").innerHTML = "<h4>Sää kello " + aika + "</h4>";
        }

        // Kutsuu säähaun
        window.onload = function () {
            haeSaa();
        }
    </script>
</body>
