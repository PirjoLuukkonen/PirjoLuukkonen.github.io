    <main>
        <div id="vastaus"></div>
        <script>    
            fetch('tietue.JSON')
            // Muunnetaan vastaus JSON muotoon   
            .then(function (response) {
                            return response.json();
            })

            //Käsitellään muunnettu (eli JSON muotoinen) vastaus ja kutsutaan funktiota kerro()ja välitetään sille json-vastaus
            .then(function (responseJson) {
            kerro(responseJson); 
            }) 
            // Jos hakemisessa tulisi jokin virhe, kirjoitetaan sivulle siitä tieto
            .catch(function (error) {
                document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
            })
            // Funktio, joka hakee tiedon objektista ja kirjoittaa ne sivulle

            function kerro(obj) {
                    let tiedot = "<h1>" + obj.otsikko + "</h1><br>"+ obj.kuvaus + "<br><hr>"
                // Kuvan määritteleminen
                    + "<p><img src=" + obj.kuva + "></p>"
                // Keskitetään teksti center-tagillä keskelle
                    + "<h3>" + "Opintojakso" + "</h3>" + "Nimi: " + obj.opintojakso.nimi + "<br>"
                    + "Tunnus: " + obj.opintojakso.tunnus + "<br>"
                    + "Opintopisteet: " + obj.opintojakso.opintopisteet + "<br>"

                // Väliotsikkona Aiheet
                tiedot += "<p><h3> Aiheet </h3>";

                // for silmukka, joka luo linkit sivuille
                for (var i = 0; i < obj.tekniikat.length; i++) {
                    tiedot += "<b>Aihe: " + obj.tekniikat[i].aihe + "</b>";
                    tiedot += " <a href=" + obj.tekniikat[i].linkki + ">" + obj.tekniikat[i].linkki + "</a>" + "<br>";
                }
                tiedot += "</p>";

                document.getElementById("vastaus").innerHTML = tiedot;

            }
        </script>
    </main>
